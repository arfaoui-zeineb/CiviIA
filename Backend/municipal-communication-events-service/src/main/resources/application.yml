server:
  port: 8081
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: municipal-communication-events-service

  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:civicpulse_communication}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/civicpulse}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/civicpulse/protocol/openid-connect/certs}

# Cloudinary Configuration
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:demo}
  api-key: ${CLOUDINARY_API_KEY:demo_key}
  api-secret: ${CLOUDINARY_API_SECRET:demo_secret}

# External Services Integration
services:
  department:
    base-url: ${DEPARTMENT_SERVICE_URL:http://localhost:8082}

# Resilience4j
resilience4j:
  circuitbreaker:
    instances:
      departmentService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000ms
        permittedNumberOfCallsInHalfOpenState: 3
  retry:
    instances:
      departmentService:
        maxAttempts: 3
        waitDuration: 500ms
  timelimiter:
    instances:
      departmentService:
        timeoutDuration: 2s

# OpenAPI Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

# Scheduled Jobs
app:
  scheduling:
    announcement-expiration-cron: "0 * * * * *" # Every minute

