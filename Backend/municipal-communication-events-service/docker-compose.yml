version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: civicpulse-communication-db
    environment:
      POSTGRES_DB: civicpulse_communication
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d civicpulse_communication"]
      interval: 5s
      timeout: 5s
      retries: 5

  communication-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: civicpulse-communication-service
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: civicpulse_communication
      DB_USER: postgres
      DB_PASSWORD: postgres
    restart: unless-stopped

volumes:
  postgres_data:

