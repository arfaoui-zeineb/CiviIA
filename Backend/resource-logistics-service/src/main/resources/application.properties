spring.application.name=resource-logistics-service
server.port=${SERVER_PORT:8081}

# Base de donnees du service (une base par service,voir dossier technique 2.1)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/resource_logistics?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Documentation OpenAPI / Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
